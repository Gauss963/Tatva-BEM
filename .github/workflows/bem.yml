name: BEM verification
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,jax]' ruff==0.17.1
        working-directory: bem
      - run: ruff check .
        working-directory: bem
      - run: ruff format --check .
        working-directory: bem
      - run: python -m pytest --junitxml=pytest-results.xml
        working-directory: bem
      - name: Publish bounded test failure details
        if: failure()
        working-directory: bem
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('pytest-results.xml')
          if path.is_file():
              failures = []
              for case in ET.parse(path).iter('testcase'):
                  for tag in ('failure', 'error'):
                      item = case.find(tag)
                      if item is not None:
                          failures.append((case, item))
              for case, item in failures[:5]:
                  message = case.get('name', '') + ': ' + item.get('message', '') + '\n' + (item.text or '')[-5000:]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + message)
          PY
